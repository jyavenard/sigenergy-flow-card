name: Pull Requests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARD_FILE: sigenergy-flow-card.js

jobs:
  syntax:
    name: JavaScript syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Parse the card file
        run: |
          if node --check "$CARD_FILE"; then
            echo "✅ $CARD_FILE"
          else
            echo "::error file=$CARD_FILE::Syntax error in $CARD_FILE"
            exit 1
          fi

